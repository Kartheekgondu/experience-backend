spring.application.name=experience

# ---------- Database (set these in Render > Environment) ----------
# SPRING_DATASOURCE_URL may be either:
#   jdbc:mysql://HOST:PORT/DB?sslMode=REQUIRED
#   mysql://USER:PASS@HOST:PORT/DB?ssl-mode=REQUIRED   (Aiven's "Service URI" - auto-converted)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL:jdbc:mysql://localhost:3306/experience_db}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:root}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:Kartheek123@}}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

server.port=${PORT:9090}
server.forward-headers-strategy=framework

# ---------- App ----------
# Comma-separated list of allowed frontend origins
app.allowed-origins=${APP_ALLOWED_ORIGINS:https://experience-frontend-ivory.vercel.app,http://localhost:5173}
app.public-base-url=${APP_PUBLIC_BASE_URL:https://experience-backend-8mps.onrender.com}
app.file-storage-dir=${UPLOAD_DIR:uploads/experience-letters}
app.from-email=${MAIL_FROM:Kartheekgondu123@gmail.com}

# ---------- Mail (Gmail SMTP) - credentials ONLY from environment ----------
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:Kartheekgondu123@gmail.com}
spring.mail.password=${MAIL_PASSWORD:uhyukwugiggsdhaq}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=15000
spring.mail.properties.mail.smtp.timeout=20000
spring.mail.properties.mail.smtp.writetimeout=20000

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=26MB
